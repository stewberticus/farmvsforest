name: Core rules tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run rules engine tests (no Unity needed)
        run: dotnet test Tools/CoreTests
      - name: Balance simulator smoke run
        run: dotnet run -c Release --project Tools/BalanceSim -- --games 10
